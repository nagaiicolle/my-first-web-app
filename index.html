<!-- HTML5であることを宣言 -->
<!DOCTYPE html>

<!-- 日本語のページであることを指定 -->
<html lang="ja">
    <head>
        <!-- 日本語のページであることを指定 -->
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        
        <!-- viewport	スマホ画面に合わせる設定 -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Normalize.css ブラウザごとの初期スタイルの違いを整える -->
        <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

        <!-- 自分で作成するデザインのスタイルシート -->
        <link rel="stylesheet" href="./style.css">

        <!-- Font Awesome SNSなどのアイコンを表示する -->
        <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">

        <!-- Google Fontsから「Noto Sans JP」を読み込む -->
         <link rel="preconnect" href="https://fonts.googleapis.com">
         <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
         <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;200;300;400;500;700&display=swap" rel="stylesheet">

        <!-- JavaScriptを読み込む -->
        <script src="./script.js" defer></script>

        <!-- ブラウザのタブに表示するタイトル -->
        <title>iicollectionサイト</title>
    </head> 
    <body>
        <header></header>
        <section></section>
        <footer></footer>
    </body>
</html>
